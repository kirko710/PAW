<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,
initial-scale=1.0" />
<title>Masuk — Aura</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="split">
<!-- Left -->
<div class="left">
<div class="left-icon"></div>
<p class="brand">Aura</p>
<p class="tagline">Digital Experience</p>
<p class="left-desc">Selamat datang kembali. Masuk untuk mengakses
pengalaman digital yang dipersonalisasi untuk anda.</p>
<div class="dots">
<div class="dot"></div>
<div class="dot active"></div>
</div>
</div>
<!-- Right -->
<div class="right">
<h1>Masuk</h1>
<div class="field">
<label for="email">Alamat Email</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">
<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1
0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
<polyline points="22,6 12,13 2,6"/>
</svg>
<input type="email" id="email" placeholder="nama@email.com" />
</div>
</div>
<div class="field">
<label for="password">Kata Sandi</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">
<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
<path d="M7 11V7a5 5 0 0 1 10 0v4"/>
</svg>
<input type="password" id="password" placeholder="Minimal 8
karakter" />
<span class="eye-toggle">&#128065;</span>
</div>
</div>
<div class="check-row">
<label>
<input type="checkbox" checked /> Ingat Saya
</label>
<a href="#">Lupa kata sandi?</a>
</div>
<button class="btn-primary">Masuk ke Akun</button>
<div class="divider">Atau lanjutkan dengan</div>
<div class="social-row">
<button class="btn-social">
<img src="https://www.google.com/favicon.ico" alt="Google" />
Google
</button>
<button class="btn-social">
<img src="https://www.facebook.com/favicon.ico" alt="Facebook" />
Facebook
</button>
</div>
<p class="bottom-link">
Belum punya akun? <a href="daftar.html">Daftar Sekarang &rarr;</a>
</p>
</div>
</div>
</body>
</html>
