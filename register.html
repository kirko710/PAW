<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar — Aura</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="split">
<!-- Left -->
<div class="left">
<div class="left-icon"></div>
<p class="brand">Aura</p>
<p class="tagline">Digital Experience</p>
<p class="left-desc">Bergabunglah dan mulai perjalanan digital Anda.
Proses pendaftaran hanya membutuhkan beberapa menit.</p>
<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
</div>
</div>
<!-- Right -->
<div class="right">
<h1>Daftar</h1>
<div class="form-row">
<div class="field">
<label for="fname">Nama Depan</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">

<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
<circle cx="12" cy="7" r="4"/>
</svg>
<input type="text" id="fname" placeholder="Nama" />
</div>
</div>
<div class="field">
<label for="lname">Nama Belakang</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">

<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
<circle cx="12" cy="7" r="4"/>
</svg>
<input type="text" id="lname" placeholder="Nama" />
</div>
</div>
</div>
<div class="field">
<label for="email">Alamat Email</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">
<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1
0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
<polyline points="22,6 12,13 2,6"/>
</svg>
<input type="email" id="email" placeholder="nama@email.com" />
</div>
</div>
<div class="field">
<label for="phone">Nomor Telefon</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">
<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0
1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1
3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45
2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84
0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
</svg>
<input type="tel" id="phone" placeholder="081xxxxx" />
</div>
</div>
<div class="form-row">
<div class="field">
<label for="password">Kata Sandi</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">

<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
<path d="M7 11V7a5 5 0 0 1 10 0v4"/>
</svg>
<input type="password" id="password" placeholder="Minimal 8
Karakter" />
<span class="eye-toggle">&#128065;</span>
</div>
</div>
<div class="field">
<label for="confirm">Konfirmasi Kata Sandi</label>
<div class="input-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
stroke-width="2">

<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
<path d="M7 11V7a5 5 0 0 1 10 0v4"/>
</svg>
<input type="password" id="confirm" placeholder="Ulangi kata
sandi" />
</div>
</div>
</div>
<div class="check-row">
<label>
<input type="checkbox" checked /> Saya Menyetujui Syarat &amp;
Ketentuan Yang Berlaku
</label>
</div>
<button class="btn-primary">Buat Akun Sekarang</button>
<p class="bottom-link">
Sudah punya akun? <a href="index.html">&larr; Masuk</a>
</p>
</div>
</div>
</body>
</html>
